# Optional bioRxiv API import. Disable it if you only want journal RSS feeds.
biorxiv_api:
  enabled: true
  base_url: "https://api.biorxiv.org"
  server: "biorxiv"
  days_back: 2
  request_interval_seconds: 2
  max_pages_per_category: 5
  categories:
    - "bioinformatics"
    - "genomics"
    - "systems_biology"
    - "molecular_biology"
    - "cell_biology"

rules:
  exclude_rules:
    - name: "Non-research items"
      source_contains: ""
      keywords:
        - "news"
        - "podcast"
        - "editorial"
        - "correction"
        - "retraction"
        - "erratum"
        - "book review"
  tag_rules:
    - tag: "AI / ML"
      keywords:
        - "artificial intelligence"
        - "machine learning"
        - "deep learning"
        - "large language model"
        - "foundation model"
    - tag: "genomics"
      keywords:
        - "genome"
        - "genomics"
        - "transcriptome"
        - "single-cell"
        - "GWAS"
