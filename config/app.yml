app:
  title: "Paper Radar"
  default_mode: "original"
  page_limit: 2000

deepseek:
  api_key_env: "DEEPSEEK_API_KEY"
  api_key: ""
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  max_retries: 3
  title_timeout_seconds: 30
  summary_timeout_seconds: 60
  title_translate_concurrency: 3

output_rss:
  title: "Paper Radar Feed"
  link: "http://localhost:8090/feed.xml"
  description: "RSS feed with translated titles and source descriptions"
  original_title: "Paper Radar Original Feed"
  original_description: "Original titles and descriptions without AI processing"

html_sources:
  - name: "Nature"
    url: "https://www.nature.com/nature/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Genetics"
    url: "https://www.nature.com/ng/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Communications"
    url: "https://www.nature.com/ncomms/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Plants"
    url: "https://www.nature.com/nplants/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Machine Intelligence"
    url: "https://www.nature.com/natmachintell/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Computational Science"
    url: "https://www.nature.com/natcomputsci/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Reviews Genetics"
    url: "https://www.nature.com/nrg/articles"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Methods"
    url: "https://www.nature.com/nmeth/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Nature Biotechnology"
    url: "https://www.nature.com/nbt/articles?type=article"
    parser: "nature_articles"
    pages: 2
  - name: "Genome Biology (Springer)"
    url: "https://link.springer.com/journal/13059/articles"
